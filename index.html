  <head>
    <meta charset="UTF-8" />

    <link data-static-seo rel="canonical" href="https://inerimbd.com/" />
    <meta data-static-seo property="og:title" content="INERIM Interior | Your Dream Space. Our Responsibility." />
    <meta data-static-seo property="og:description" content="Modern interior design, modular kitchens, wardrobes, custom furniture and HPL/acrylic supply in Bangladesh. Packages from ৳1,350/sft. Get your price now." />
    <meta data-static-seo property="og:type" content="website" />
    <meta data-static-seo property="og:url" content="https://inerimbd.com/" />
    <meta data-static-seo property="og:image" content="https://inerimbd.com/designs/d17.jpg" />
    <meta data-static-seo name="twitter:card" content="summary_large_image" />
    <!--seo:end-->

    <!-- Google Search Console verification -->
    <meta name="google-site-verification" content="H_p3pwqpHutZYzIc0tlsw1yPP4RZuy9d5AxR-SG9nbs" />

    <meta name="theme-color" content="#f4f1ec" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <style>
      /* Critical styles: correct colours from the very first frame, and a clean splash until the app starts. */
      html, body { margin: 0; background: #f4f1ec; color: #171614; font-family: "Inter Tight", system-ui, sans-serif; }
      .boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 1; }
      .boot b { font-size: 28px; font-weight: 600; letter-spacing: -0.06em; animation: boot 1.4s ease-in-out infinite; }
      .boot i { font-style: normal; color: #0b7875; }
      @keyframes boot { 0%, 100% { opacity: 0.35 } 50% { opacity: 1 } }
      /* Page content for crawlers and screen readers; shown visually only when JavaScript is off. */
      .prerender { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
    </style>
    <noscript>
      <style>
        .boot { display: none; }
        .prerender { position: static; width: auto; height: auto; overflow: visible; clip: auto; clip-path: none; white-space: normal; max-width: 860px; margin: 0 auto; padding: 32px 20px; line-height: 1.6; }
        .prerender img { max-width: 100%; height: auto; border-radius: 16px; }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root">
      <div class="boot" aria-hidden="true"><b>INERIM<i>.</i></b></div>
      <div class="prerender">
        <!--content:start-->
        <header>
          <h1>INERIM Interior: interior design, furniture and materials in Bangladesh</h1>
          <p>Modern, premium and customer-focused interior design and execution in Bangladesh. Packages from ৳1,350 per square foot.</p>
        </header>
        <!--content:end-->
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
